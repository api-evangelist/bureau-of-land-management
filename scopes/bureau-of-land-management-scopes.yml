method: probed
source: >-
  well-known/bureau-of-land-management-mlrs-openid-configuration.json,
  well-known/bureau-of-land-management-glorecords-openid-configuration.json,
  well-known/bureau-of-land-management-blm-egis-arcgis-oauth-authorization-server.json
note: |
  READ THIS BEFORE USING THE SCOPE LIST. BLM authors none of these scopes. MLRS and GLO Records
  run on Salesforce Experience Cloud, and their discovery documents advertise the stock
  Salesforce platform scope set — identical strings on both hosts, including scopes for
  products BLM plainly does not operate through these sites (pardot_api, einstein_gpt_api,
  cdp_*). They describe what the PLATFORM can issue, not what BLM grants.

  BLM publishes no scopes/permissions reference page of its own. Both surfaces are, in
  practice, closed: every non-discovery path on both hosts answered 401 to an anonymous
  client on 2026-09-05, and there is no self-service developer registration.

  The public geospatial surface — the GBP Hub Search API, the 13 ArcGIS Server instances and
  the WMS endpoints — has NO scope model because it has no authentication at all.
schemes:
  - name: mlrs-oidc
    surface: https://mlrs.blm.gov
    source: well-known/bureau-of-land-management-mlrs-openid-configuration.json
    scope_authorship: salesforce-platform-default
    flows:
      - flow: authorizationCode
        authorizationUrl: https://mlrs.blm.gov/services/oauth2/authorize
        tokenUrl: https://mlrs.blm.gov/services/oauth2/token
  - name: glorecords-oidc
