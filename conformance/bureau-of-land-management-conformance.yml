domain_standards:
  - id: project-open-data-dcat-us-1.1
    name: Project Open Data / DCAT-US v1.1 (OMB M-13-13 federal open data catalog)
    conforms: true
    evidence: >-
      https://gbp-blm-egis.hub.arcgis.com/data.json HTTP 200 application/json, 4.8 MB, 803
      datasets. The document declares itself:
      "@context":"https://project-open-data.cio.gov/v1.1/schema/catalog.jsonld",
      "@type":"dcat:Catalog",
      "conformsTo":"https://project-open-data.cio.gov/v1.1/schema", and every dataset carries
      publisher.name "Bureau of Land Management". This is the machine-readable inventory a US
      federal agency is required to publish, and it is the domain standard for this provider's
      sector — an integrator that already speaks DCAT-US needs no bespoke connector.
    also_served_at: https://gbp-blm-egis.hub.arcgis.com/api/feed/dcat-us/1.1.json
