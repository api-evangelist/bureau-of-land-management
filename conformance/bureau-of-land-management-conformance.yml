note: |
  Every entry below was read out of a document BLM actually serves, not out of a marketing
  claim. The OGC classes are quoted from the conformsTo[] array returned by the GBP Hub's own
  OGC API landing page and saved verbatim as
  conformance/bureau-of-land-management-gbp-hub-ogc-conformance.json.

  BLM publishes no certification programme of its own — no trust centre, no SOC 2 / ISO 27001
  / FedRAMP statement was found on blm.gov — so NO Compliance pointer is wired for this
  provider. The underlying ArcGIS Online platform carries Esri's FedRAMP authorization, but
  that is Esri's certification and would be a false claim on BLM's behalf.
