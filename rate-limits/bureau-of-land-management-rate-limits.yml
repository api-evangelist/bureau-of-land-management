method: probed
source: >-
  Live unauthenticated calls to https://gbp-blm-egis.hub.arcgis.com/api/search/v1 and
  https://gis.blm.gov/arcgis on 2026-09-05, plus a search of blm.gov and the GBP Hub for a
  published limits page.
provider: Bureau of Land Management
providerId: bureau-of-land-management
note: |
  SUPERSEDES a scaffold. This file previously carried invented tiers (free 10 req/min, pro 100
  req/min, enterprise 1000 req/min, X-RateLimit-* headers) written by a 2026-05-04 bulk sweep.
  None of it was real. BLM publishes no rate limits and returns no rate-limit headers.

  limit_count is 0 on purpose. An honest zero is the finding: an agent calling this API has no
  runtime signal telling it how hard it may push, and no documented ceiling to design against.
  The only real capacity signals BLM emits are per-request result caps, recorded under
  result_caps below — those are not rate limits, but they are what actually bounds a call.
limit_count: 0
limits: []
