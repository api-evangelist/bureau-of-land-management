note: |
  BLM SHIPS NO PACKAGED CLIENT LIBRARY. Nothing on npm, nothing on PyPI, nothing on Maven
  Central, NuGet, RubyGems, Packagist, crates.io or pkg.go.dev. The three PyPI names that look
  like hits are all unrelated third parties and are recorded under rejected_candidates so the
  next pass does not re-litigate them.

  What BLM does publish is SOURCE, in the DOI-BLM GitHub organization: an ArcGIS authentication
  handler for Python Requests and a set of worked examples against BLM's own services. Neither
  is released to a registry, neither is versioned, and neither can be installed with a package
  manager — so `version: null` and `registry: none` below is the finding, not a gap in the
  search. A consumer has to clone a default branch and pin nothing.

  DO NOT wire an SDKs pointer for this provider: sdk_count would be crediting BLM with client
  libraries it has not published.
