note: |
  BLM OPERATES NO MCP SERVER. Searched 2026-09-05: no mcp.blm.gov (DNS fails), no /mcp route on
  gis.blm.gov, www.blm.gov or the GBP Hub (404 on all three), nothing in the DOI-BLM GitHub
  organization, nothing on npm or PyPI, and no /.well-known/ai-plugin.json on any of the nine
  hosts probed.

  One negative is worth quoting because it is unusually explicit. eplanning.blm.gov runs on
  Microsoft Power Pages, and its /.well-known/oauth-authorization-server answered HTTP 500 with
  {"error":"server_error","error_description":"MCP is not enabled for this site"}. The platform
  BLM already pays for ships an MCP feature; BLM has not turned it on.

  `status: candidate` and `mode: none`: every tool below is an API Evangelist PROPOSAL derived
  one-for-one from an operation verified callable anonymously on 2026-09-05, not something BLM
  runs. No endpoint is invented.

  Why this is worth proposing: the whole public surface is anonymous and read-only, which is the
  cheapest possible MCP server to stand up — no token exchange, no consent screen, no write
  consequence. See agentic-access/, where all 17 operations classify as connected/read.
