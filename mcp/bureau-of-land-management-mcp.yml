tools_without_a_published_contract:
  - name: list_blm_gis_services
    description: >-
      Enumerate the 785 ArcGIS services across BLM's 13 REST instances (national + 12 state).
    backing_surface: 'https://gis.blm.gov/<instance>/rest/services?f=json'
    reason: >-
      Real, anonymously callable and inventoried in
      openapi/bureau-of-land-management-arcgis-service-inventory.json, but BLM publishes no
      OpenAPI for the ArcGIS REST surface, so there is no operationId to bind to. Listed here
      rather than in tools[] so the crosswalk stays honest.
  - name: get_blm_wms_capabilities
    description: Fetch the OGC WMS 1.3.0 capabilities for one of the 42 WMS-enabled national services.
    backing_surface: 'https://gis.blm.gov/arcgis/services/<service>/MapServer/WMSServer?service=WMS&request=GetCapabilities'
    reason: >-
      The GetCapabilities document IS the contract; seven are saved verbatim in openapi/. No
      OpenAPI operation backs it.
