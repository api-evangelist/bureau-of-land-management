note: |
  BLM publishes no API versioning policy, no deprecation policy, no SLA and no status page.
  Searched blm.gov and the GBP Hub 2026-09-05: nothing. This is recorded as an absence with the
  probes that establish it, not as a gap in our looking.

  What DOES exist as a change signal is the dataset level: every one of the 803 datasets in the
  DCAT-US catalog carries `issued` and `modified` timestamps, so a consumer can detect data
  change even though they cannot detect contract change.
