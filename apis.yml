  - ArcGIS Server 11.5 REST
  - Anonymous access (token security disabled)
  - OGC WMS 1.3.0 on 42 national services
  - SQL-92 attribute query
  - Spatial query
  - GeoJSON output
  - Statistics and pagination
  - Pre-cached tile services
  useCases:
  - Public land status and ownership lookup
  - PLSS township/range/section resolution
  - Grazing allotment research
  - Recreation site mapping
  - Mineral and cadastral research
  - State-level BLM data extraction
