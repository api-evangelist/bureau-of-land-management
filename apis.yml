description: 'The Bureau of Land Management (BLM) is the U.S. Department of the Interior bureau that administers
  245 million surface acres of public land and 700 million acres of subsurface mineral estate — about
  one in every ten acres of the United States — for outdoor recreation, livestock grazing, mineral and
  energy development, conservation and cultural heritage. Its public API surface is geospatial and entirely
  anonymous: a catalog of 803 datasets served as OGC API - Records and DCAT-US 1.1, and 785 ArcGIS Server
  services across thirteen REST instances (one national, twelve state) that BLM operates itself on gis.blm.gov,
  42 of which also publish OGC WMS 1.3.0. There is no API key, no plan and no quota — and equally no versioning
  policy, changelog, status page or developer support channel. Every published operation is read-only;
  the transactional systems (MLRS mining claims and land records, GLO Records land patents, ePlanning
  NEPA documents) sit behind a login and publish no contract.'
