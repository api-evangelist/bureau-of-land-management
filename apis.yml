- aid: bureau-of-land-management:blm-arcgis-gis-services
  name: BLM National and State ArcGIS REST / OGC WMS Services
  tags:
  - Federal-Government
  - Geospatial
  - GIS
  - Land
  - Cadastral
  - OGC
  - WMS
  tags_raw:
  - Federal Government
  - Geospatial
  - GIS
  - Land
  - Cadastral
  - OGC
  - WMS
  humanURL: https://www.blm.gov/services/geospatial/GISData
  baseURL: https://gis.blm.gov/arcgis/rest/services
  description: 'BLM''s own ArcGIS Server estate, operated on blm.gov infrastructure rather than a hosted
    platform: thirteen REST instances — one national plus Alaska, Arizona, California, Colorado, Eastern
    States, Idaho, Montana, Nevada, New Mexico, Oregon, Utah and Wyoming — serving 785 services (463 MapServer,
    283 FeatureServer, 16 ImageServer, 12 GPServer). All run ArcGIS Server 11.5 with token security disabled,
    so the service directory, layer schemas and attribute/spatial queries are anonymously callable. 42
    of the 46 national services also publish OGC WMS 1.3.0 GetCapabilities, which is the machine-readable
    contract for this surface — BLM publishes no OpenAPI for it. Covers surface management agency, the
    PLSS cadastral fabric, grazing allotments, recreation sites, the National Landscape Conservation System,
    transportation and administrative boundaries.'
  properties:
  - url: openapi/bureau-of-land-management-arcgis-service-inventory.json
    type: ArcGIS
  - url: openapi/bureau-of-land-management-arcgis-national-rest-services.json
