    type: GetCapabilities
  - url: openapi/bureau-of-land-management-admin-unit-wms-capabilities.xml
    type: GetCapabilities
  - url: openapi/bureau-of-land-management-recreation-wms-capabilities.xml
    type: GetCapabilities
  - url: openapi/bureau-of-land-management-nlcs-wms-capabilities.xml
    type: GetCapabilities
  - url: openapi/bureau-of-land-management-grazing-allotment-wms-capabilities.xml
    type: GetCapabilities
  - url: openapi/bureau-of-land-management-gtlf-wms-capabilities.xml
    type: GetCapabilities
  - url: https://gis.blm.gov/arcgis/services/lands/BLM_Natl_SMA_Cached_without_PriUnk/MapServer/WMSServer?service=WMS&request=GetCapabilities
    type: WMS
  - url: wsdl/bureau-of-land-management-sma-mapserver.wsdl
    type: WSDL
  - url: wsdl/bureau-of-land-management-plss-cadnsdi-mapserver.wsdl
    type: WSDL
  - url: https://gis.blm.gov/arcgis/services/lands/BLM_Natl_SMA_Cached_without_PriUnk/MapServer?wsdl
    type: SOAP
